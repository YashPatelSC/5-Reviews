<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Inn & Suites Stockbridge Atlanta South Feedback</title>

  <style>
    :root{
      --sleep-navy:#24324a;
      --sleep-purple:#6b4fa1;
      --sleep-light:#f6f4fa;
      --white:#ffffff;
      --text:#263244;
      --muted:#6d7480;
      --border:#e5e1ed;
      --gold:#f4b400;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(135deg, var(--sleep-navy), var(--sleep-purple));
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:600px;
      background:var(--white);
      border-radius:28px;
      box-shadow:0 18px 50px rgba(0,0,0,0.18);
      overflow:hidden;
      border:1px solid var(--border);
      text-align:center;
    }

    .top{
      background:white;
      padding:28px 20px 18px 20px;
      border-bottom:1px solid var(--border);
    }

    .logo-wrap{
      width:175px;
      margin:0 auto 12px auto;
      background:white;
      padding:10px;
      border-radius:18px;
      box-shadow:0 6px 16px rgba(0,0,0,0.06);
    }

    .logo-wrap img{
      width:100%;
      display:block;
    }

    .title{
      color:var(--sleep-navy);
      font-size:24px;
      line-height:1.25;
      font-weight:700;
      margin-top:8px;
    }

    .subtitle{
      margin-top:8px;
      color:var(--muted);
      font-size:14px;
    }

    .content{
      padding:30px 20px 20px 20px;
    }

    .question{
      font-size:26px;
      color:var(--text);
      font-weight:700;
      margin-bottom:25px;
    }

    .stars{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .star-btn{
      width:100%;
      border:2px solid var(--border);
      background:white;
      padding:18px;
      border-radius:16px;
      font-size:26px;
      cursor:pointer;
      transition:0.15s;
      color:var(--gold);
    }

    .star-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
      border-color:#bdb0d5;
      background:var(--sleep-light);
    }

    .star-btn:active{
      transform:translateY(0);
    }

    .footer{
      padding:16px 20px 24px 20px;
      font-size:14px;
      line-height:1.45;
      color:var(--muted);
    }

    @media (max-width:480px){
      body{
        padding:14px;
      }

      .card{
        border-radius:22px;
      }

      .title{
        font-size:21px;
      }

      .question{
        font-size:23px;
      }

      .star-btn{
        padding:16px;
        font-size:24px;
      }
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="top">
      <div class="logo-wrap">
        <img src="sleep-inn-logo.png" alt="Sleep Inn & Suites Logo">
      </div>

      <div class="title">
        Sleep Inn & Suites<br>
        Stockbridge Atlanta South
      </div>

      <div class="subtitle">
        Stockbridge, Georgia
      </div>
    </div>

    <div class="content">
      <div class="question">How was your stay?</div>

      <div class="stars">
        <button class="star-btn" onclick="goToLink(5)" aria-label="5 stars">★★★★★</button>
        <button class="star-btn" onclick="goToLink(4)" aria-label="4 stars">★★★★☆</button>
        <button class="star-btn" onclick="goToLink(3)" aria-label="3 stars">★★★☆☆</button>
        <button class="star-btn" onclick="goToLink(2)" aria-label="2 stars">★★☆☆☆</button>
        <button class="star-btn" onclick="goToLink(1)" aria-label="1 star">★☆☆☆☆</button>
      </div>
    </div>

    <div class="footer">
      Thank you for your feedback. Your response helps us improve the guest experience.
    </div>

  </div>

  <script>

    const googleReviewLink = "https://search.google.com/local/writereview?placeid=ChIJkVoI0yFW9IgRl6s82MLU3zc";
    const privateFeedbackLink = "https://forms.gle/uEeMrRQDzdLRkt868";

    function goToLink(rating){
      if(rating >= 4){
        window.location.href = googleReviewLink;
      } else {
        window.location.href = privateFeedbackLink;
      }
    }
  </script>
</body>
</html>
